services:
  - type: web
    name: ai-hiring-guardian-api
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-hiring-guardian-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://your-frontend-url.vercel.app"
    rootDir: backend

databases:
  - name: ai-hiring-guardian-db
    databaseName: aihiringguardian
    user: render_user
